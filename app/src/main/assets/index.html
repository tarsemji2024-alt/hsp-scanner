<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Mannat Communication</title>
<script src="xlsx.full.min.js"></script>
<script src="html5-qrcode.min.js"></script>
<style>
  :root{color-scheme:dark}
  *{box-sizing:border-box}
  body{font-family:sans-serif;margin:0;background:#121317;color:#e6e6e6}
  .wrap{padding:16px 18px}
  .top{margin-top:32px}
  .avatar{width:76px;height:76px;border-radius:50%;object-fit:cover;border:3px solid #3f8fd6;box-shadow:0 0 0 3px #1c2a3a;flex:none}
  .brand{font-size:clamp(13px,5vw,30px);font-weight:800;line-height:1.2;color:#fff;background:#d81b60;padding:16px 8px;border-radius:16px;text-align:center;white-space:nowrap;box-shadow:0 4px 12px rgba(216,27,96,.45)}
  .info{display:flex;align-items:center;justify-content:space-between;gap:8px;margin:22px 0 0}
  .info .name{font-size:18px;font-weight:600;color:#fff;white-space:nowrap}
  .info .mob{font-size:17px;font-weight:600;color:#fff;white-space:nowrap;letter-spacing:.3px}
  .photo{width:96px;height:96px;border-radius:50%;object-fit:cover;flex:none;border:3px solid #3f8fd6;box-shadow:0 0 0 3px #1c2a3a}
  .row{display:flex;gap:14px;margin:24px 0 18px}
  .row.secondary{margin:0 0 18px}
  .row.secondary button{padding:14px 8px;font-size:16px}
  button{flex:1;padding:26px 8px;border:0;border-radius:16px;font-size:20px;font-weight:600;color:#fff;background:#3b4252;box-shadow:0 4px 10px rgba(0,0,0,.35)}
  button.green{background:#2e7d32}
  button:active{opacity:.85}
  #msg{text-align:center;min-height:20px;font-weight:bold;margin:0 0 4px;font-size:15px}
  #raw{text-align:center;font-size:13px;color:#9aa;word-break:break-all}
  #cam{display:none;margin:10px 0}
  #cam video{width:100%;height:60vh;min-height:340px;object-fit:cover;border-radius:16px;background:#000}
  #reader{width:100%;min-height:340px;border-radius:16px;overflow:hidden}
  #reader video{width:100%!important;height:60vh!important;min-height:340px;object-fit:cover}
  table{width:100%;border-collapse:separate;border-spacing:0;margin-top:10px}
  thead th{background:#222329;color:#fff;padding:18px 12px;font-size:17px}
  thead th:first-child{border-radius:14px 0 0 14px;text-align:left;width:18%}
  thead th:last-child{border-radius:0 14px 14px 0;text-align:center;width:22%}
  td{padding:12px;border-bottom:1px solid #26272d}
  td.no{color:#9aa}
  td.rsn{text-align:center;font-size:16px;word-break:break-all}
  td.del{text-align:center}
  .delbtn{flex:none;padding:10px 14px;line-height:0;background:#c62828;border-radius:10px}
  .clearallbtn{flex:none;background:transparent;box-shadow:none;padding:6px;color:#fff;line-height:0}
  #empty{text-align:center;color:#6b6f78;margin-top:60px;font-size:16px}
  #bkOverlay{display:none;position:fixed;top:0;left:0;right:0;bottom:0;background:rgba(0,0,0,.8);z-index:50;overflow:auto;padding:14px}
  #bkBox{background:#1b1c22;border-radius:18px;padding:16px;max-width:520px;margin:10px auto;box-shadow:0 8px 28px rgba(0,0,0,.6)}
  #bkBox h2{margin:0 0 4px;font-size:20px;color:#fff}
  #bkBox h3{margin:18px 0 8px;font-size:15px;color:#9ecbff}
  #bkBox p.hint{margin:0 0 10px;font-size:13px;color:#9aa}
  #bkBox button{padding:14px 8px;font-size:16px;margin:0}
  .bkrow{display:flex;gap:10px;margin-bottom:10px}
  .bkitem{display:flex;align-items:center;justify-content:space-between;gap:8px;padding:10px 0;border-bottom:1px solid #2a2b32;font-size:14px}
  .bkitem .t{flex:1}
  .bkitem .t small{display:block;color:#9aa;font-size:12px;margin-top:2px}
  .bkitem button{flex:none;padding:8px 14px;font-size:14px;border-radius:10px;background:#3f8fd6}
  #bkConfirm{display:none;background:#2a2410;border:1px solid #8a6d1a;border-radius:12px;padding:12px;margin:12px 0}
  #bkConfirm p{margin:0 0 10px;font-size:14px;color:#ffe08a}
  button.orange{background:#ef6c00}
  button.gray{background:#A3ABFF;color:#10122b}
  button.purple{background:#7e57c2}
  button.cyan{background:#80fff2;color:#00332e}
  button.blue{background:#3f8fd6}
  /* क्लाउड वाले तीनों बटन: अलग-अलग, बीच में 16px दूरी */
  #bkBox .bkcol button{width:100%;margin:0 0 16px;padding:16px 8px}
  #bkBox .bkcol button:last-child{margin-bottom:0}
  #bkCloudInfo{font-size:13px;color:#cfd8dc;margin:0 0 10px;line-height:1.5}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <div class="brand">Mannat Communication Moonak</div>
  </div>
  <div class="info">
    <span class="name">Tarsem ji</span>
    <img class="photo" src="profile.jpg" alt="">
    <span class="mob">M: 9988863580</span>
  </div>

  <div class="row">
    <button class="purple" id="startBtn">📷&nbsp; स्कैन शुरू</button>
    <button class="green" id="exportBtn"><svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-6px"><path d="M12 3v12"/><path d="M7 10l5 5 5-5"/><path d="M4 17v3h16v-3"/></svg>&nbsp; फाइल एक्सपोर्ट</button>
  </div>
  <div class="row secondary">
    <button id="importBtn">📂&nbsp; पुरानी फाइल इंपोर्ट</button>
    <button id="torchBtn">🔦&nbsp; लाइट चालू</button>
  </div>
  <div class="row secondary">
    <button id="backupBtn">💾&nbsp; बैकअप / रिस्टोर</button>
  </div>
  <input id="importFile" type="file" accept=".xlsx,.xls,.csv" style="display:none">
  <input id="bkFile" type="file" accept=".json,application/json" style="display:none">

  <div id="cam"><video id="video" playsinline muted></video><div id="reader"></div></div>


  <div id="msg"></div>
  <div id="raw"></div>

  <table>
    <thead><tr><th>#</th><th>RSN</th><th><button id="clearAllBtn" class="clearallbtn" aria-label="सभी RSN डिलीट करें" title="सभी RSN डिलीट करें"><svg style="vertical-align:middle" width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 10v6M14 10v6"/></svg></button></th></tr></thead>
    <tbody id="list"></tbody>
  </table>
  <div id="empty">कोई RSN डेटा उपलब्ध नहीं है। स्कैन शुरू करें।</div>
</div>

<div id="bkOverlay">
  <div id="bkBox">
    <h2>💾 बैकअप / रिस्टोर</h2>
    <p class="hint">आपका RSN डेटा हर बदलाव पर अपने आप बैकअप होता है।</p>

    <div id="bkConfirm">
      <p id="bkConfirmText"></p>
      <div class="bkrow">
        <button class="green" id="bkMerge">➕ मर्ज करें</button>
        <button class="orange" id="bkReplace">♻️ बदल दें</button>
      </div>
      <button class="gray" id="bkCancelRestore" style="width:100%">रद्द करें</button>
    </div>

    <div class="bkrow">
      <button class="green" id="bkSaveBtn">⬇️ Backup </button>
      <button id="bkLoadBtn">📂Restore </button>
    </div>

    <div id="bkCloudWrap">
      <h3>☁️ Google Drive backup </h3>
      <p id="bkCloudInfo"></p>
      <div id="bkCloudBtns" class="bkcol"></div>
    </div>

    <div id="bkAutoWrap">
       <div id="bkAuto"></div>
    </div>

    <button class="gray" id="bkClose" style="width:100%;margin-top:16px">close </button>
  </div>
</div>

<script>
(function(){
  var KEY = 'rsn_list_v1';
  var list = [];
  var wiped = false; // true = localStorage में डेटा की कुंजी ही नहीं मिली (पहली बार या डेटा मिट गया)
  try { wiped = localStorage.getItem(KEY) === null; } catch(e){}
  try { list = JSON.parse(localStorage.getItem(KEY) || '[]'); } catch(e){ list = []; }

  var $ = function(id){ return document.getElementById(id); };
  var msg = $('msg'), raw = $('raw'), tbody = $('list'), empty = $('empty');
  var lastCode = '', lastTime = 0;

  function save(){ try { localStorage.setItem(KEY, JSON.stringify(list)); } catch(e){} backupLatest(); }

  function say(text, color){
    msg.textContent = text;
    msg.style.color = color || '#e6e6e6';
  }

  function isValid(code){ return /^R/i.test(code); }

  function extractRSN(text){
    var parts = String(text || '').toUpperCase().split(/[^A-Z0-9]+/);
    for (var i = 0; i < parts.length; i++) {
      if (parts[i].charAt(0) === 'R' && /\d/.test(parts[i])) return parts[i];
    }
    return '';
  }

  function render(){
    tbody.innerHTML = '';
    list.forEach(function(rsn, i){
      var tr = document.createElement('tr');
      var td1 = document.createElement('td'); td1.className = 'no'; td1.textContent = i + 1;
      var td2 = document.createElement('td'); td2.className = 'rsn'; td2.textContent = rsn;
      var td3 = document.createElement('td'); td3.className = 'del';
      var b = document.createElement('button');
      b.className = 'delbtn'; b.innerHTML = '<svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 6h18"/><path d="M8 6V4h8v2"/><path d="M6 6l1 14h10l1-14"/><path d="M10 10v6M14 10v6"/></svg>'; b.setAttribute('aria-label','डिलीट');
      b.onclick = function(){
        list.splice(i, 1);save();render();
        say('डिलीट हो गया: ' + rsn, '#ffb74d');
      };
      td3.appendChild(b);
      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      tbody.appendChild(tr);
    });
    empty.style.display = list.length ? 'none' : 'block';
  }

  $('clearAllBtn').onclick = function(){
    if (!list.length) { say('डिलीट करने के लिए कोई RSN नहीं है।', '#ffb74d'); return; }
    snapshot('clearall');
    list = []; save(); render(); lastCode = ''; raw.textContent = '';
    say('✅ सभी RSN डिलीट हो गए।', '#66bb6a');
  };

  function addCode(input){
    var text = String(input || '').trim();
    if (!text) return '';
    var code = extractRSN(text);
    if (!code || !isValid(code)) { var invalid = '❌ Not jio Device '; say(invalid, '#ef5350'); return invalid; }
    if (list.indexOf(code) !== -1) { var duplicate = '⚠️ All Ready Add ' + code; say(duplicate, '#ffb74d'); return duplicate; }
    list.push(code); save(); render();
    var added = '✅ Add : ' + code;
    say(added, '#66bb6a');
    return added;
  }

  function importWorkbook(buffer){
    if (typeof XLSX === 'undefined') { say('xlsx.full.min.js File not found ।', '#ef5350'); return; }
    try {
      var wb = XLSX.read(buffer, { type: 'array' });
      if (!wb.SheetNames || !wb.SheetNames.length) throw new Error('Sheet not found');
      var rows = XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });
      var start = 0, col = -1;
      if (rows.length) {
        for (var c = 0; c < rows[0].length; c++) {
          if (/^(rsn|serial\s*(number|no)?|code)$/i.test(String(rows[0][c]).trim())) { col = c; start = 1; break; }
        }
      }
      snapshot('import');
      var added = 0, duplicates = 0, invalid = 0;
      for (var i = start; i < rows.length; i++) {
        var cells = col >= 0 ? [rows[i][col]] : rows[i];
        var found = false;
        for (var j = 0; j < cells.length; j++) {
          var code = extractRSN(cells[j]);
          if (!code || !isValid(code)) continue;
          found = true;
          if (list.indexOf(code) !== -1) duplicates++;
          else { list.push(code); added++; }
        }
        if (!found && cells.some(function(v){ return String(v).trim() !== ''; })) invalid++;
      }
      save(); render();
      say('✅ इंपोर्ट पूरा: ' + added + ' नए RSN जोड़े' + (duplicates ? ', ' + duplicates + ' डुप्लिकेट छोड़े' : '') + (invalid ? ', ' + invalid + ' पंक्तियाँ छोड़ीं' : ''), '#66bb6a');
    } catch(e) { say('फाइल पढ़ नहीं पाए। XLSX, XLS या CSV फाइल चुनें।', '#ef5350'); }
  }

  function importBase64(data){
    try {
      var binary = atob(data), bytes = new Uint8Array(binary.length);
      for (var i = 0; i < binary.length; i++) bytes[i] = binary.charCodeAt(i);
      importWorkbook(bytes);
    } catch(e) { say('इंपोर्ट फाइल पढ़ नहीं पाए।', '#ef5350'); }
  }
  window.onImportFile = importBase64;
  $('importBtn').onclick = function(){
    if (window.Android && window.Android.openImport) window.Android.openImport();
    else $('importFile').click();
  };
  $('importFile').onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var reader = new FileReader();
    reader.onload = function(){ importWorkbook(reader.result); };
    reader.onerror = function(){ say('फाइल पढ़ नहीं पाए।', '#ef5350'); };
    reader.readAsArrayBuffer(file); e.target.value = '';
  };

  var stream = null, timer = null, detector = null, h5 = null, scanning = false;

  function onCode(val){
    val = (val || '').trim();
    var now = Date.now();
    if (val === lastCode && now - lastTime < 2500) return; // एक ही कोड बार-बार न जुड़े
    lastCode = val; lastTime = now;
    addCode(val);
  }

  function uiOn(){ scanning = true; $('cam').style.display = 'block'; $('startBtn').textContent = '⏹\u00a0 स्कैन बंद'; say('स्कैन चालू है... (QR और बारकोड दोनों)'); }

  function stopScan(){
    scanning = false;
    if (timer) { clearInterval(timer); timer = null; }
    if (stream) { stream.getTracks().forEach(function(t){ t.stop(); }); stream = null; }
    if (h5) { h5.stop().catch(function(){}).then(function(){ try{h5.clear();}catch(e){} h5 = null; }); }
    $('cam').style.display = 'none';
    $('video').style.display = 'block';
    $('startBtn').textContent = '📷\u00a0 स्कैन शुरू';
  }

  function startFallback(){
    if (typeof Html5Qrcode === 'undefined') { say('स्कैनर लाइब्रेरी (html5-qrcode.min.js) नहीं मिली।', '#ef5350'); return; }
    $('video').style.display = 'none';
    h5 = new Html5Qrcode('reader');
    h5.start({ facingMode: 'environment' }, { fps: 10, qrbox: { width: 300, height: 200 } }, onCode, function(){})
      .then(uiOn).catch(function(){ say('कैमरा की अनुमति नहीं मिली।', '#ef5350'); h5 = null; });
  }

  function startScan(){
    if (!('BarcodeDetector' in window)) { startFallback(); return; }
    if (!detector) detector = new BarcodeDetector();
    navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } }).then(function(s){
      stream = s;
      var v = $('video'); v.srcObject = s; v.play();
      uiOn();
      timer = setInterval(function(){
        if (v.readyState < 2) return;
        detector.detect(v).then(function(codes){
          codes.forEach(function(c){ onCode(c.rawValue); });
        }).catch(function(){});
      }, 400);
    }).catch(function(){ say('कैमरा की अनुमति नहीं मिली।', '#ef5350'); });
  }

  var nativeMode = false;

  function nextNativeScan(){
    setTimeout(function(){
      if (nativeMode && window.Android && window.Android.startScanner) window.Android.startScanner();
    }, 500);
  }   // <-- यह } पहले गायब था

  window.onNativeScan = function(val, raw){
    var message = addCode(val);
    if (message && window.Android && window.Android.showScannerMessage) window.Android.showScannerMessage(message);
    if (nativeMode) nextNativeScan();
  };

  window.onNativeCancel = function(){
    nativeMode = false;
    $('startBtn').innerHTML = '📷\u00a0 स्कैन शुरू';
    say('स्कैन बंद किया (' + list.length + ' RSN लिस्ट में हैं)', '#ffb74d');
  };

  window.onNativeError = function(msg){
    if (window.Android && window.Android.showScannerMessage) window.Android.showScannerMessage('स्कैनर एरर: ' + msg);
    nativeMode = false;
    $('startBtn').innerHTML = '📷\u00a0 स्कैन शुरू';
    say('स्कैनर एरर: ' + msg, '#ef5350');
  };

  $('startBtn').onclick = function(){
    if (window.Android && window.Android.startScanner) {
      nativeMode = true;
      $('startBtn').innerHTML = '📷\u00a0 स्कैन चालू';
      say('लगातार स्कैन चालू है। बंद करने के लिए स्कैनर में पीछे दबाएँ।');
      window.Android.startScanner();
    } else {
      scanning ? stopScan() : startScan();
    }
  };

  $('torchBtn').onclick = function(){
    var turnOn = $('torchBtn').getAttribute('data-on') !== 'true';
    if (window.Android && window.Android.setTorch) window.Android.setTorch(turnOn);
    $('torchBtn').setAttribute('data-on', turnOn ? 'true' : 'false');
    $('torchBtn').textContent = turnOn ? '🔦 लाइट बंद' : '🔦 लाइट चालू';
    say(turnOn ? 'लाइट चालू है।' : 'लाइट बंद है।');
  };
  window.onTorchChanged = function(on, automatic){
    $('torchBtn').setAttribute('data-on', on ? 'true' : 'false');
    $('torchBtn').textContent = on ? '🔦 लाइट बंद' : '🔦 लाइट चालू';
    if (automatic) say(on ? 'कम रोशनी में लाइट अपने आप चालू हुई।' : 'रोशनी पर्याप्त है; लाइट बंद हुई।');
  };
  window.onTorchError = function(message){ say(message || 'लाइट नहीं बदली जा सकी।', '#ef5350'); };

  // ---- एक्सपोर्ट ----
  $('exportBtn').onclick = function(){
    if (!list.length) { say('एक्सपोर्ट के लिए कोई डेटा नहीं है।', '#ef5350'); return; }
    if (typeof XLSX === 'undefined') { say('xlsx.full.min.js फाइल नहीं मिली।', '#ef5350'); return; }
    snapshot('export'); // एक्सपोर्ट के बाद लिस्ट खाली हो जाती है, इसलिए पहले कॉपी रख लो
    var rows = [['#', 'RSN']].concat(list.map(function(r, i){ return [i + 1, r]; }));
    var ws = XLSX.utils.aoa_to_sheet(rows);
    var wb = XLSX.utils.book_new();
    XLSX.utils.book_append_sheet(wb, ws, 'RSN');
    var name = 'RSN_list.xlsx';

    if (window.Android && window.Android.saveFile) {
      window.Android.saveFile(XLSX.write(wb, { bookType: 'xlsx', type: 'base64' }), name);
    } else if (window.showSaveFilePicker) {
      var out = XLSX.write(wb, { bookType: 'xlsx', type: 'array' });
      window.showSaveFilePicker({
        suggestedName: name,
        types: [{ description: 'Excel फाइल', accept: { 'application/vnd.openxmlformats-officedocument.spreadsheetml.sheet': ['.xlsx'] } }]
      }).then(function(h){ return h.createWritable().then(function(w){ return w.write(out).then(function(){ return w.close(); }); }); })
        .then(done)
        .catch(function(e){ if (e && e.name !== 'AbortError') say('सेव नहीं हो पाई।', '#ef5350'); });
    } else {
      XLSX.writeFile(wb, name);
      done();
    }
  };

  function done()
  {
    list = []; save(); render(); lastCode = ''; raw.textContent = '';
    say('✅ फाइल सेव हो गई। नई स्कैनिंग के लिए तैयार है।', '#66bb6a');
  }

  window.onExportDone = function(){ done();};

  window.onExportCancel = function() {say('सेव नहीं हुई या कैंसिल कर दी गई। लिस्ट सुरक्षित है।', '#ffb74d'); };

  function hasNative(){ return !!(window.Android && window.Android.autoBackup); }

  function payload(reason){ return JSON.stringify({ app: 'rsn-scanner', version: 1, time: Date.now(), reason: reason || '', list: list }); }

  function backupLatest(){ if (!hasNative() || !list.length) return;
    try { window.Android.autoBackup(payload(''), ''); } catch(e){} }

  function snapshot(reason){ if (!hasNative() || !list.length) return;
    try { window.Android.autoBackup(payload(reason), reason); } catch(e){} }

  function p2(n){ return (n < 10 ? '0' : '') + n; }

  function fmtTime(t){ var d = new Date(t);
  return p2(d.getDate()) + '/' + p2(d.getMonth() + 1) + '/' + d.getFullYear() + ' ' + p2(d.getHours()) + ':' + p2(d.getMinutes()); }

  var REASONS = { export: 'एक्सपोर्ट से पहले', clearall: 'सभी डिलीट से पहले', 'import': 'इंपोर्ट से पहले', restore: 'रिस्टोर से पहले', manual: 'मैन्युअल बैकअप' };

  function openPanel(){ renderCloud(); renderAuto(); $('bkOverlay').style.display = 'block'; }
  function closePanel(){ $('bkOverlay').style.display = 'none'; $('bkConfirm').style.display = 'none'; pendingRestore = null; cloudFlag = false; }

  function renderAuto(){
    var box = $('bkAuto');
    box.innerHTML = '';
    if (!hasNative()) { $('bkAutoWrap').style.display = 'none'; return; }
    var items = [];
    try { items = JSON.parse(window.Android.listBackups() || '[]'); } catch(e){ items = []; }
    if (!items.length) { box.textContent = 'अभी कोई ऑटो बैकअप नहीं है।'; return; }
    items.forEach(function(it){
      var row = document.createElement('div'); row.className = 'bkitem';
      var t = document.createElement('div'); t.className = 't';
      var title = it.name === 'latest.json' ? 'ताज़ा बैकअप' : (REASONS[it.reason] || 'बैकअप');
      t.textContent = title + ' — ' + it.count + ' RSN';
      var sm = document.createElement('small'); sm.textContent = fmtTime(it.time);
      t.appendChild(sm);
      var b = document.createElement('button'); b.textContent = 'रिस्टोर';
      b.onclick = function(){ window.Android.restoreAuto(it.name); };
      row.appendChild(t); row.appendChild(b);
      box.appendChild(row);
    });
  }

  function parseBackup(text){
    var obj = JSON.parse(text);
    var arr = Array.isArray(obj) ? obj : obj.list;
    if (!Array.isArray(arr)) throw new Error('bad');
    var out = [];
    arr.forEach(function(v){
      var c = extractRSN(v);
      if (c && isValid(c) && out.indexOf(c) === -1) out.push(c);
    });
    return out;
  }

  var pendingRestore = null;

  function offerRestore(text){
    var parsed;
    try { parsed = parseBackup(text); } catch(e){ say('बैकअप फाइल सही नहीं है।', '#ef5350'); return; }
    if (!parsed.length) { say('इस बैकअप में कोई RSN नहीं है।', '#ffb74d'); return; }
    pendingRestore = parsed;
    var fresh = parsed.filter(function(c){ return list.indexOf(c) === -1; }).length;
    $('bkConfirmText').textContent = 'बैकअप में ' + parsed.length + ' RSN हैं। अभी लिस्ट में ' + list.length + ' हैं, उनमें से ' + fresh + ' नए होंगे। क्या करें?';
    $('bkConfirm').style.display = 'block';
    $('bkOverlay').style.display = 'block';
    renderAuto();
  }

  function doRestore(mode){
    if (!pendingRestore) return;
    var fromCloud = cloudFlag;
    snapshot('restore'); // रिस्टोर से पहले मौजूदा लिस्ट की कॉपी
    var total = pendingRestore.length, added = 0;
    if (mode === 'replace') { list = pendingRestore.slice(); added = total; }
    else pendingRestore.forEach(function(c){ if (list.indexOf(c) === -1) { list.push(c); added++; } });
    pendingRestore = null;
    save(); render(); lastCode = ''; raw.textContent = '';
    if (fromCloud && window.Android && window.Android.cloudResolved) window.Android.cloudResolved();
    closePanel();
    say('✅ रिस्टोर पूरा: ' + (mode === 'replace' ? 'लिस्ट बदली गई, अब ' + list.length + ' RSN हैं' : added + ' नए RSN जोड़े (कुल ' + list.length + ')'), '#66bb6a');
  }

  $('backupBtn').onclick = openPanel;
  $('bkClose').onclick = closePanel;
  $('bkMerge').onclick = function(){ doRestore('merge'); };
  $('bkReplace').onclick = function(){ doRestore('replace'); };
  $('bkCancelRestore').onclick = function(){ pendingRestore = null; cloudFlag = false; $('bkConfirm').style.display = 'none'; };

  $('bkSaveBtn').onclick = function(){
    if (!list.length) { say('बैकअप के लिए कोई RSN नहीं है।', '#ef5350'); closePanel(); return; }
    var d = new Date();
    var name = 'RSN_backup_' + d.getFullYear() + p2(d.getMonth() + 1) + p2(d.getDate()) + '_' + p2(d.getHours()) + p2(d.getMinutes()) + '.json';
    var data = payload('manual');
    if (window.Android && window.Android.saveBackupFile) {
      window.Android.saveBackupFile(data, name);
    } else {
      var a = document.createElement('a');
      a.href = URL.createObjectURL(new Blob([data], { type: 'application/json' }));
      a.download = name; document.body.appendChild(a); a.click();
      setTimeout(function(){ URL.revokeObjectURL(a.href); a.remove(); }, 1000);
      window.onBackupSaved(true);
    }
  };

  $('bkLoadBtn').onclick = function(){
    if (window.Android && window.Android.openBackupFile) window.Android.openBackupFile();
    else $('bkFile').click();
  };
  $('bkFile').onchange = function(e){
    var file = e.target.files && e.target.files[0];
    if (!file) return;
    var r = new FileReader();
    r.onload = function(){ offerRestore(String(r.result)); };
    r.onerror = function(){ say('बैकअप फाइल पढ़ नहीं पाए।', '#ef5350'); };
    r.readAsText(file); e.target.value = '';
  };

  window.onBackupFileLoaded = offerRestore;
  window.onBackupSaved = function(ok){
    closePanel();
    say(ok ? '✅ बैकअप फाइल सेव हो गई।' : 'बैकअप सेव नहीं हुआ या कैंसिल कर दिया गया।', ok ? '#66bb6a' : '#ffb74d');
  };
  window.onBackupError = function(m){ say(m || 'बैकअप में समस्या आई।', '#ef5350'); };


  // ---- Google Drive बैकअप (अपने आप) ----
  var cloudFlag = false; // true = अभी जो रिस्टोर ऑफ़र है वह क्लाउड का है
  function hasCloud(){ return !!(window.Android && window.Android.cloudStatus); }

  function renderCloud(){
    var wrap = $('bkCloudWrap');
    if (!hasCloud()) { wrap.style.display = 'none'; return; }
    var st = {};
    try { st = JSON.parse(window.Android.cloudStatus() || '{}'); } catch(e){ st = {}; }
    var info = $('bkCloudInfo'), btns = $('bkCloudBtns');
    info.style.color = ''; btns.innerHTML = '';
    function mk(label, cls, fn){
      var b = document.createElement('button');
      b.textContent = label; if (cls) b.className = cls; b.onclick = fn; btns.appendChild(b);
    }
    if (!st.enabled) {
      info.textContent = 'अभी जुड़ा नहीं है।';
      mk('🔗 Gmail से जोड़ें', 'green', function(){ info.textContent = 'जोड़ रहे हैं...'; window.Android.cloudConnect(); });
      return;
    }
    var txt = '✅ जुड़ा है: ' + (st.email || 'Google खाता');
    txt += st.lastSync ? ' — last Backup ' + fmtTime(st.lastSync) + '।' : ' — Not Backup Now ';
    if (st.hold) txt += ' ⚠️ क्लाउड में पहले से बैकअप मौजूद है, "अभी बैकअप करें" से उसे इस फोन के डेटा से बदल दें।';
    else if (st.dirty) txt += ' नया डेटा इंटरनेट मिलते ही बैकअप होगा।';
    else txt += ' सारा डेटा बैकअप है।';
    info.textContent = txt;
    mk('☁️ cloud Backup', 'green', function(){ info.textContent = 'बैकअप हो रहा है...'; window.Android.cloudBackupNow(); });
    mk('⬇️ cloud Restore', 'blue', function(){ info.textContent = 'क्लाउड से ला रहे हैं...'; window.Android.cloudRestore(); });
    mk('Gmail से अलग करें', 'cyan', function(){ window.Android.cloudDisable(); });
  }

  window.onCloudStatus = function(){ renderCloud(); };
  window.onCloudError = function(m){
    renderCloud();
    var info = $('bkCloudInfo');
    if (info) { info.textContent = (m || 'क्लाउड बैकअप में समस्या आई।') + '\n' + info.textContent; info.style.color = '#ef9a9a'; info.style.whiteSpace = 'pre-line'; }
    say(m || 'क्लाउड बैकअप में समस्या आई।', '#ef5350');
  };
  window.onCloudFileLoaded = function(text){ cloudFlag = true; offerRestore(text); };

  render();

  if (wiped && hasNative()) {
    try {
      var found = JSON.parse(window.Android.listBackups() || '[]');
      if (found.length && found[0].count > 0) {
        say('⚠️ ऐप का डेटा खाली मिला, लेकिन ऑटो बैकअप में ' + found[0].count + ' RSN हैं। नीचे से रिस्टोर करें।', '#ffb74d');
        openPanel();
      }
    } catch(e){}
  }
})();
</script>
</body>
</html>
